x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV:-development}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  api:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      SERVICE_ROLE: api
      API_KEY: ${API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      BING_CLIENT_ID: ${BING_CLIENT_ID:-}
      BING_CLIENT_SECRET: ${BING_CLIENT_SECRET:-}
      BING_REDIRECT_URI: ${BING_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      INITIAL_SUPERUSER_EMAIL: ${INITIAL_SUPERUSER_EMAIL:-}
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:-}
      MFA_ENFORCEMENT_ENABLED: ${MFA_ENFORCEMENT_ENABLED:-false}
      RENDERING_ENABLED: ${RENDERING_ENABLED:-false}
      PAGESPEED_ENABLED: ${PAGESPEED_ENABLED:-false}
      PRIVACY_DELETION_LEDGER_FILE: /app/privacy-ledger/deletions.jsonl
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - exports_data:/app/exports
      - privacy_ledger_data:/app/privacy-ledger
    networks: [backend, app-egress]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 512
    mem_limit: 1536m
    restart: unless-stopped
  worker:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      SERVICE_ROLE: crawl-worker
      # Keep legacy default jobs drainable during the first queue-split deployment.
      # Drain pre-split crawl jobs from `crawls` during the queue transition.
      WORKER_QUEUES: sitemaps,crawls_light,crawls,default,verifications
      WORKER_NAME: light-1
    command: python -m app.worker
    volumes: ["exports_data:/app/exports"]
    networks: [backend, crawler-egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 512
    mem_limit: 1536m
    restart: unless-stopped
  crawl-worker-2:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      SERVICE_ROLE: crawl-worker
      WORKER_QUEUES: crawls_full
      WORKER_NAME: full-1
    command: python -m app.worker
    volumes: ["exports_data:/app/exports"]
    networks: [backend, crawler-egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 512
    mem_limit: 2g
    restart: unless-stopped
  crawl-worker-3:
    <<: *app-hardening
    profiles: ["crawl-overflow"]
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      SERVICE_ROLE: crawl-worker
      WORKER_QUEUES: crawls_light,crawls_full
      WORKER_NAME: crawl-overflow-1
    command: python -m app.worker
    volumes: ["exports_data:/app/exports"]
    networks: [backend, crawler-egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 256
    mem_limit: 1g
    restart: unless-stopped
  integration-worker:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${INTEGRATION_DATABASE_URL:?INTEGRATION_DATABASE_URL is required}
      SERVICE_ROLE: integration-worker
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BING_CLIENT_ID: ${BING_CLIENT_ID:-}
      BING_CLIENT_SECRET: ${BING_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PAGESPEED_ENABLED: ${PAGESPEED_ENABLED:-false}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      WORKER_QUEUES: integrations,maintenance,performance
      WORKER_NAME: integrations-1
    command: python -m app.worker
    networks: [backend, app-egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 384
    mem_limit: 1536m
    restart: unless-stopped
  export-worker:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${EXPORT_DATABASE_URL:?EXPORT_DATABASE_URL is required}
      SERVICE_ROLE: export-worker
      WORKER_QUEUES: exports
      WORKER_NAME: exports-1
    command: python -m app.worker
    volumes: ["exports_data:/app/exports"]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 256
    mem_limit: 1g
    restart: unless-stopped
  render-worker:
    <<: *app-hardening
    profiles: ["rendering"]
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      <<: *runtime-env
      DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      SERVICE_ROLE: render-worker
      USER_AGENT: ${USER_AGENT:-SEO-Monitor-Bot/0.1}
      RENDERING_ENABLED: ${RENDERING_ENABLED:-false}
      WORKER_QUEUES: renders
      WORKER_NAME: render-1
    command: python -m app.worker
    networks: [backend, crawler-egress]
    init: true
    shm_size: 256mb
    mem_limit: 1g
    cpu_shares: 256
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  scheduler:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:?SCHEDULER_DATABASE_URL is required}
      SERVICE_ROLE: scheduler
    command: python -m app.scheduler
    networks: [backend]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.queue import get_redis; assert get_redis().ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 128
    mem_limit: 512m
    restart: unless-stopped
  migrate:
    <<: *app-hardening
    profiles: ["tools"]
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVICE_ROLE: migration
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: alembic upgrade head
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    cpu_shares: 128
    mem_limit: 512m
  database-roles:
    image: postgres:16-alpine
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-seo}
      PGUSER: ${POSTGRES_USER:-seo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?DB_API_PASSWORD is required}
      DB_CRAWLER_PASSWORD: ${DB_CRAWLER_PASSWORD:?DB_CRAWLER_PASSWORD is required}
      DB_INTEGRATION_PASSWORD: ${DB_INTEGRATION_PASSWORD:?DB_INTEGRATION_PASSWORD is required}
      DB_EXPORT_PASSWORD: ${DB_EXPORT_PASSWORD:?DB_EXPORT_PASSWORD is required}
      DB_SCHEDULER_PASSWORD: ${DB_SCHEDULER_PASSWORD:?DB_SCHEDULER_PASSWORD is required}
    volumes:
      - ./scripts/database-roles.sql:/database-roles.sql:ro
    networks: [backend]
    command:
      - sh
      - -ec
      - >-
        psql -v ON_ERROR_STOP=1 -v database_name="$$PGDATABASE"
        -v api_password="$$DB_API_PASSWORD" -v crawler_password="$$DB_CRAWLER_PASSWORD"
        -v integration_password="$$DB_INTEGRATION_PASSWORD"
        -v export_password="$$DB_EXPORT_PASSWORD"
        -v scheduler_password="$$DB_SCHEDULER_PASSWORD" -f /database-roles.sql
    depends_on:
      postgres: {condition: service_healthy}
    cpu_shares: 64
    mem_limit: 128m
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo}
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  exports_data:
  privacy_ledger_data:
networks:
  backend:
    name: seo-monitor-backend
    internal: true
    enable_ipv6: false
  app-egress:
    name: seo-monitor-app-egress
    enable_ipv6: false
  crawler-egress:
    name: seo-monitor-crawler-egress
    enable_ipv6: false
