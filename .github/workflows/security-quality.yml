name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Verify environment
        run: python -m pip check

      - name: Generate reproducible CycloneDX SBOM
        run: |
          mkdir -p outputs/ci
          cyclonedx-py requirements requirements.lock \
            --output-reproducible --output-format JSON \
            --output-file outputs/ci/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seo-monitor-sbom
          path: outputs/ci/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest

      - name: Static security analysis
        run: bandit -q -r app -ll

      - name: Scan production sources for secrets
        run: |
          detect-secrets scan \
            app scripts compose.yaml compose.prod.yaml compose.staging.yaml \
            pyproject.toml Dockerfile Dockerfile.render \
            > /tmp/seo-monitor-secrets.json
          python -c "import json; data=json.load(open('/tmp/seo-monitor-secrets.json')); count=sum(len(items) for items in data.get('results', {}).values()); print({'secret_candidates': count}); raise SystemExit(bool(count))"

      - name: Audit locked Python dependencies
        run: pip-audit -r requirements.lock --strict

  container-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application image
        run: docker build --pull --tag seo-monitor-ci:${{ github.sha }} .

      - name: Scan application image
        id: scan-application
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: seo-monitor-ci:${{ github.sha }}
          format: json
          output: /tmp/application-scan.json
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

      - name: Build renderer image
        run: docker build --pull --file Dockerfile.render --tag seo-monitor-render-ci:${{ github.sha }} .

      - name: Verify renderer runtime without network
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=512m --cap-drop ALL --security-opt no-new-privileges \
            seo-monitor-render-ci:${{ github.sha }} python scripts/verify-renderer-image.py

      - name: Locate residual renderer package records
        run: |
          docker run --rm --network none --read-only --user 0 --entrypoint python \
            seo-monitor-render-ci:${{ github.sha }} -c '
          import os
          from pathlib import Path
          for root in ("/usr", "/opt", "/ms-playwright", "/root"):
              for directory, _, files in os.walk(root):
                  for name in files:
                      path = Path(directory) / name
                      if name.endswith(".whl"):
                          print("WHEEL", path)
                      if name.endswith(".json") or name in ("METADATA", "vendor.txt"):
                          try:
                              if path.stat().st_size > 20000000:
                                  continue
                              data = path.read_text(errors="replace")
                              if ("msgpack" in data and "1.1.2" in data) or ("setuptools" in data and "70.3.0" in data):
                                  print("OLD_PACKAGE_RECORD", path)
                          except OSError:
                              pass
          '

      - name: Scan renderer image
        id: scan-renderer
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: seo-monitor-render-ci:${{ github.sha }}
          format: json
          output: /tmp/renderer-scan.json
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

      - name: Enforce container scan gate
        if: always()
        env:
          APPLICATION_SCAN: ${{ steps.scan-application.outcome }}
          RENDERER_SCAN: ${{ steps.scan-renderer.outcome }}
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          for filename in ("/tmp/application-scan.json", "/tmp/renderer-scan.json"):
              path = Path(filename)
              if path.exists():
                  for result in json.loads(path.read_text()).get("Results", []):
                      for item in result.get("Vulnerabilities", []):
                          print(filename, result.get("Target"), item.get("PkgName"),
                                item.get("InstalledVersion"), item.get("VulnerabilityID"),
                                item.get("FixedVersion"), item.get("PkgPath"))
          PYTHON
          printf 'application_scan=%s\nrenderer_scan=%s\n' "$APPLICATION_SCAN" "$RENDERER_SCAN"
          test "$APPLICATION_SCAN" = success
          test "$RENDERER_SCAN" = success
