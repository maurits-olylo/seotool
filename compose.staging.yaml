name: seo-monitor-staging

x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

services:
  api:
    <<: *app-hardening
    build: .
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-18000}:8000"
    volumes:
      - staging_exports_data:/app/exports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 512
    mem_limit: 1536m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_staging}
      POSTGRES_USER: ${POSTGRES_USER:-seo_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpu_shares: 384
    mem_limit: 2g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpu_shares: 128
    mem_limit: 256m
    restart: unless-stopped

  render-worker:
    <<: *app-hardening
    profiles: ["rendering"]
    build:
      context: .
      dockerfile: Dockerfile.render
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      WORKER_QUEUES: renders
      WORKER_NAME: render-staging-1
    command: python -m app.worker
    init: true
    shm_size: 256mb
    cpu_shares: 128
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  staging_postgres_data:
    name: seo-monitor-staging-postgres-data
  staging_redis_data:
    name: seo-monitor-staging-redis-data
  staging_exports_data:
    name: seo-monitor-staging-exports-data
