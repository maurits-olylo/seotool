name: seo-monitor-staging

x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV:-staging}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  api:
    <<: *app-hardening
    build: .
    environment:
      <<: *runtime-env
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      SERVICE_ROLE: api
      API_KEY: ${API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      BING_CLIENT_ID: ${BING_CLIENT_ID:-}
      BING_CLIENT_SECRET: ${BING_CLIENT_SECRET:-}
      BING_REDIRECT_URI: ${BING_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      INITIAL_SUPERUSER_EMAIL: ${INITIAL_SUPERUSER_EMAIL:-}
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:-}
      MFA_ENFORCEMENT_ENABLED: ${MFA_ENFORCEMENT_ENABLED:-false}
      RENDERING_ENABLED: ${RENDERING_ENABLED:-false}
      PAGESPEED_ENABLED: ${PAGESPEED_ENABLED:-false}
      PRIVACY_DELETION_LEDGER_FILE: /app/privacy-ledger/deletions.jsonl
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-18000}:8000"
    volumes:
      - staging_exports_data:/app/exports
      - staging_privacy_ledger_data:/app/privacy-ledger
      - staging_render_artifacts_data:/app/render-artifacts:ro
    networks: [backend, app-egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 512
    mem_limit: 1536m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_staging}
      POSTGRES_USER: ${POSTGRES_USER:-seo_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpu_shares: 384
    mem_limit: 2g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - staging_redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpu_shares: 128
    mem_limit: 256m
    restart: unless-stopped

  render-artifacts-init:
    <<: *app-hardening
    profiles: ["rendering"]
    build:
      context: .
      dockerfile: Dockerfile.render
    user: root
    command: ["install", "-d", "-o", "pwuser", "-g", "pwuser", "-m", "700", "/app/render-artifacts"]
    volumes: ["staging_render_artifacts_data:/app/render-artifacts"]
    networks: [backend]
    cpu_shares: 64
    mem_limit: 128m
    restart: "no"
  render-worker:
    <<: *app-hardening
    profiles: ["rendering"]
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      <<: *runtime-env
      DATABASE_URL: ${CRAWLER_DATABASE_URL:?CRAWLER_DATABASE_URL is required}
      SERVICE_ROLE: render-worker
      USER_AGENT: ${USER_AGENT:-SEO-Monitor-Bot/0.1}
      RENDERING_ENABLED: ${RENDERING_ENABLED:-false}
      WORKER_QUEUES: renders
      WORKER_NAME: render-staging-1
    command: python -m app.worker
    volumes: ["staging_render_artifacts_data:/app/render-artifacts"]
    networks: [backend, crawler-egress]
    init: true
    shm_size: 256mb
    cpu_shares: 128
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      render-artifacts-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import worker_is_registered; assert worker_is_registered()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  migrate:
    <<: *app-hardening
    profiles: ["tools"]
    build: .
    environment:
      APP_ENV: ${APP_ENV:-staging}
      SERVICE_ROLE: migration
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: alembic upgrade head
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    cpu_shares: 64
    mem_limit: 384m

  database-roles:
    image: postgres:16-alpine
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-seo_staging}
      PGUSER: ${POSTGRES_USER:-seo_staging}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?DB_API_PASSWORD is required}
      DB_CRAWLER_PASSWORD: ${DB_CRAWLER_PASSWORD:?DB_CRAWLER_PASSWORD is required}
      DB_INTEGRATION_PASSWORD: ${DB_INTEGRATION_PASSWORD:?DB_INTEGRATION_PASSWORD is required}
      DB_EXPORT_PASSWORD: ${DB_EXPORT_PASSWORD:?DB_EXPORT_PASSWORD is required}
      DB_SCHEDULER_PASSWORD: ${DB_SCHEDULER_PASSWORD:?DB_SCHEDULER_PASSWORD is required}
    volumes:
      - ./scripts/database-roles.sql:/database-roles.sql:ro
    networks: [backend]
    command:
      - sh
      - -ec
      - >-
        psql -v ON_ERROR_STOP=1 -v database_name="$$PGDATABASE"
        -v api_password="$$DB_API_PASSWORD" -v crawler_password="$$DB_CRAWLER_PASSWORD"
        -v integration_password="$$DB_INTEGRATION_PASSWORD"
        -v export_password="$$DB_EXPORT_PASSWORD"
        -v scheduler_password="$$DB_SCHEDULER_PASSWORD" -f /database-roles.sql
    depends_on:
      postgres: {condition: service_healthy}
    cpu_shares: 32
    mem_limit: 128m

volumes:
  staging_postgres_data:
    name: seo-monitor-staging-postgres-data
  staging_redis_data:
    name: seo-monitor-staging-redis-data
  staging_exports_data:
    name: seo-monitor-staging-exports-data
  staging_privacy_ledger_data:
    name: seo-monitor-staging-privacy-ledger-data
  staging_render_artifacts_data:
    name: seo-monitor-staging-render-artifacts-data
networks:
  backend:
    name: seo-monitor-staging-backend
    internal: true
    enable_ipv6: false
  app-egress:
    name: seo-monitor-staging-app-egress
    enable_ipv6: false
  crawler-egress:
    name: seo-monitor-staging-crawler-egress
    enable_ipv6: false
